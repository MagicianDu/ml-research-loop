name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check lib/ scripts/ ml_intern/ codex_plugin/ tests/

      - name: Test
        run: python -m pytest tests/ -q

      - name: MCP client acceptance
        run: python scripts/mcp_client_acceptance.py --python "$(which python)"
