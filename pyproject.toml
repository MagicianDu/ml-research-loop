[project]
name = "ml-research-loop"
version = "0.1.0"
description = "AI autonomous ML research engine — ml-intern × autoresearch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "DM", email = "dm@example.com" }
]
keywords = ["ml", "autonomous", "research", "agent", "ai"]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "smolagents>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
ml-loop = "scripts.cli:main"
ml-loop-mcp = "scripts.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "scripts", "ml_intern"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
