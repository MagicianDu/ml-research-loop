[project]
name = "ml-research-loop"
version = "0.1.0"
description = "AI autonomous ML research engine — ml-intern × autoresearch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ML Research Loop contributors" }
]
keywords = ["ml", "autonomous", "research", "agent", "ai"]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "smolagents>=1.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
memory-graphiti = [
    "graphiti-core>=0.7.3",
]
memory-cognee = [
    "cognee>=0.3.9",
]
memory = [
    "graphiti-core>=0.7.3",
    "cognee>=0.3.9",
]
hf-cp-bench = [
    "datasets>=4.0.0",
    "click>=8.0.0",
    "cpmpy>=0.10.0",
    "minizinc>=0.10.0",
    "ortools>=9.12.0",
    "tqdm>=4.66.0",
]

[project.scripts]
ml-loop = "scripts.cli:main"
ml-loop-mcp = "scripts.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib", "scripts", "ml_intern"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"docs" = "docs"
"examples" = "examples"
"LICENSE" = "LICENSE"
"NOTICE" = "NOTICE"
"CITATION.cff" = "CITATION.cff"

[tool.hatch.build.targets.sdist]
include = [
    "/lib",
    "/scripts",
    "/ml_intern",
    "/codex_plugin",
    "/skills",
    "/docs",
    "/examples",
    "/base",
    "/templates",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs/hf-evaluation/**/user_eval.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
